---
# OOD cluster id — must match a file in /etc/ood/config/clusters.d/<id>.yml
# on the host. Set RELION_CLUSTER in /etc/ood/config/apps/relion5_webui/env
# to override.
cluster: "<%= ENV['RELION_CLUSTER'] || 'slurm' %>"

form:
  - bc_num_hours
  - bc_num_slots
  - working_dir

attributes:
  bc_num_hours:
    widget: number_field
    label: "Number of hours"
    value: 4
    min: 1
    max: 24
    step: 1

  bc_num_slots:
    widget: number_field
    label: "Number of CPUs"
    value: 4
    min: 1
    max: 32
    step: 1

  working_dir:
    widget: text_field
    label: "Project Directory"
    # Default resolves to the user's own home each time the form is rendered.
    # Site admins can override with RELION_DEFAULT_PROJECTS_DIR in the app
    # env file to point somewhere else (e.g. /scratch/${USER}/relion).
    value: "<%= ENV['RELION_DEFAULT_PROJECTS_DIR'] || \"#{ENV['HOME']}/relion_projects\" %>"
    help: "Directory containing your RELION project data. Will be created if missing."
